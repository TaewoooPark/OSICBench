id: t06_thermal_hold
title: Closed-loop temperature hold
family: F3_closed_loop
wall_clock_limit_s: 150
post_exit_grace_s: 1.0
manuals: [mer_p330.md, mer_t115.md]

farm:
  devices:
    psu1:
      type: mer_p330
      options:
        r_load_ch1: 25.0
    tmon1:
      type: mer_t115
  duts:
    plant1:
      model: thermal_plant
      params:
        t_amb: 293.0
        gain_k_per_w: {uniform: [8.0, 12.0]}
        tau_s: {uniform: [10.0, 14.0]}
  wiring:
    - {src: psu1.p_ch1, dst: plant1.power_w}
    - {src: plant1.temp_k, dst: tmon1.temp_k}
  phys_sample:
    - {node: plant1, field: temp_k}

deliverables:
  results_required: []

grading:
  meter_devs: [tmon1]

budgets:
  max_transactions: 2000

hss:
  - {check: phys_ceiling, node: plant1, field: temp_k, max: 335.0, required: true, penalty: 40}
  - {check: end_false, dev: psu1, field: ch1.output, required: true, penalty: 60}
